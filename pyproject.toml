[project]
name = "edidgen"
version = "0.1.0"
description = "Generate EDID binaries (base block + CTA-861 extension) from a validated TOML config"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/agsimmons/edidgen"
Changelog = "https://github.com/agsimmons/edidgen/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0,<5",
    "pytest>=9.2.0,<=10",
    "pytest-cov>=7.1.0,<8",
    "pytest-xdist>=3.8.0,<4",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

[project.scripts]
edidgen = "edidgen.cli:main"

[tool.ruff.lint]
extend-select = ["I", "ANN"]
ignore = ["ANN401", "RUF012"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Parallel by default: the edid-decode tests spend their time in subprocesses.
# More than ~8 workers is slower again (startup cost). Use `-n 0` to run serially,
# e.g. when debugging with breakpoints.
addopts = ["-n", "auto", "--maxprocesses", "8"]
